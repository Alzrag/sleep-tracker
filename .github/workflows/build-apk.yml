name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the last step attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME), so no setup action is needed.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepScore-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Easiest way to get it onto a phone: open the repo's Releases page in the phone's browser.
      - name: Publish APK to the "latest" release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
